        // Get the tile at the specified position x,y in mosaic pixels
		var getTileObject = function (x, y) {
		    var tileCount = tileArrays.length;
		
		    for (var n = 0; n < tileCount; ++n) {
		        var tileInfo = tileArrays[n];
		
		        var tileLeft = tileInfo[0];
		        var tileTop = tileInfo[1];
		        var tileWidth = tileInfo[2];
		        var tileHeight = tileInfo[3];
		        var tileRight = tileLeft + tileWidth;
		        var tileBottom = tileTop + tileHeight;
		
		        /*
		         * Use < for the right and bottom edges.
		         * This prevents a coordinate directly on a shared boundary
		         * from matching two neighboring tiles.
		         */
		        if (
		            tileLeft <= x &&
		            x < tileRight &&
		            tileTop <= y &&
		            y < tileBottom
		        ) {
		            return {
		                tileLeft: tileLeft,
		                tileTop: tileTop,
		                tileWidth: tileWidth,
		                tileHeight: tileHeight,
		
		                // Corrected calculations
		                tileRight: tileRight,
		                tileBottom: tileBottom,
		
		                tileNr: tileInfo[4],
		                imageNr: tileInfo[5],
		                imageUsageCount: tileInfo[6],
		                imageUrl: tileInfo[7],
		                imageName: tileInfo[8],
		                imageExtension: tileInfo[9]
		            };
		        }
		    }
		
		    return null;
		};

        var showPopUpWindow = function(popUpText, callback) {
            callback.showPopUp({maxWidth:300, popUpText:popUpText}, callback.args);
        }

        // This function builds the PopUp window information for the specified Tile. 
        // Returns an object with following members:
        //  maxWidth: maximum width of the popup window.
        //  popUpText: HTML text to show in the popup window.
        var getPopUpFullText = function (x,y,callback) {
            var tile = getTileObject(x,y);
            popUpText = tile === null ? "No information available" :
                        (tile.imageUrl == null? '' : '<a href="' + tile.imageUrl + '" target="TileImage"><img src="' + tile.imageUrl + '" width=300 /><br></a>')
                        + 'Tile Nr.: ' + tile.tileNr + '<br>'
                        + 'Tile Size: ' + tile.tileWidth + ' x ' + tile.tileHeight + '<br>'
                        + 'Tile Position: ' + tile.tileLeft + ' x ' + tile.tileTop + '<br>'
                        + 'Image Nr.: ' + tile.imageNr + '<br>'
                        + 'Image Name: ' + tile.imageName + '<br>'
                        + 'Image Extension: ' + tile.imageExtension + '<br>'
                        + 'Image Usage Count: ' + tile.imageUsageCount + '<br>';
            showPopUpWindow(popUpText,callback);
        };

        // PopUp showing only the image
        var getPopUpImageOnly = function (x,y,callback) {
            var tile = getTileObject(x,y);
            popUpText = tile === null || tile.imageUrl === null ? "No information available" : '<a href="' + tile.imageUrl + '" target="TileImage"><img src="' + tile.imageUrl + '" width=300 /><br></a>';
            showPopUpWindow(popUpText,callback);
        };

        // PopUp showing the image with name and usage count
        var getPopUpImageWithName = function (x,y,callback) {
            var tile = getTileObject(x,y);
            popUpText = tile === null || tile.imageUrl === null ? "No information available" : '<a href="' + tile.imageUrl + '" target="TileImage"><img src="' + tile.imageUrl + '" width=300 /><br></a>' 
                + '<center>' + tile.imageName + ' (used ' + tile.imageUsageCount + ' times)</center>';
            showPopUpWindow(popUpText,callback);
        };

        // PopUp showing only ImageNr
        var getPopUpTextOnly = function (x,y,callback) {
            var tile = getTileObject(x,y);
            popUpText = tile === null || tile.imageUrl === null ? "No information available" : '<center>image #' + tile.imageNr + ' used ' + tile.imageUsageCount + ' times</center>'; 
            showPopUpWindow(popUpText,callback);
        };

        // Get the Help Text to show when clicking on the ? button
        var getHelpText = function () {
            return {
                maxWidth: 500,
                minWidth: 300,
                popUpText:    '<table class="help-table"><thead><tr><th></th><th>Mouse</th><th>Touchscreen</th><th>Keyboard</th></tr></thead><tbody>' 
                            + '<tr><td>Zoom In</td><td>Wheel or Doubleclick</td><td>Enlarge with two Fingers</td><td>+</td></tr><tr>'
                            + '<tr><td>Zoom Out</td><td>Wheel or Shift + Doubleclick</td><td>Reduce with two Fingers</td><td>-</td></tr><tr>'
                            + '<tr><td>Pan</td><td>Left Click + Move</td><td>Short Press + Move</td><td>Arrow Keys</td></tr><tr>'
                            + '<tr><td>Show Info</td><td>Right Click</td><td>Long Press</td><td></td></tr><tr>'
                            + '<tr><td>Hide Info</td><td>Left Click on map</td><td>Short Press on map</td><td>Esc</td></tr><tr>'
                            + '<tr><td>Zoom area</td><td>Left Click + Shift + Move</td><td></td><td></td></tr><tr>'
                            + '</tbody></table>',
            }
        }; 

        // This function builds the search text.
        // This function is invoked once when loading the mosaic.
        // It returns an array with 3 elements: x,y,title.
        // If two tiles have the same title then it will be displayed only once in the search list.
        var getSearchText = function () {
            var l = tileArrays.length;
            var searchList = new Array(l);
            for (n=0; n<l; ++n) {
                tileInfo = tileArrays[n];
                searchList[n] = [tileInfo[0]+tileInfo[2]/2, tileInfo[1]+tileInfo[3]/2, tileInfo[8]];
            }
            return searchList;
        };

        // Map Options
        var mapOptions = {
            getPopUpText: getPopUpTextOnly, // function that retrieves the HTML text to show for a tile. Can be null to avoid popup.
            getHelpText: getHelpText, // function that retrieves the HTML text to show as PopUp for a help. (can be null to hide the ? button)
            attribution: "In Memory of Theresa Collins (1928–2025)", // set my own attribution text, as html text. Can be null to have no additional attribution.
            keepPopUpInView: true, // if true the map will autopan so that the popup window is awlays shown.
            fullscreenControl: !navigator.vendor.match(/apple/i),
            getSearchText: getSearchText,    // function that retrieves the text of each tile that will be searched. Null to avoid search.
            searchMiddleOfText: true, // false: search elements only by initial text
            searchCaseInsensitive: true, // false: search elements in case sensitive text
            searchAutocomplete: true, // complete input with first suggested result and select this filled-in text.
            searchAutoHideMarker: true, // remove circle and marker on search control collapsed
            searchMarkerFound: null, // specify a L.Icon or null for the default
            searchText:'Tile...', // text for the Search
            searchTextError:'Tile not found',    //error message
            searchTextCancel: 'Cancel',          //title in cancel button        
            searchTextPlaceholder: 'Search Tile...',   //placeholder value         
            searchContainer: '', // container id to insert Search Control
            zoomControl: true, // false to not show a zoom control with +/- buttons
            panInertia: true, // can be null, true or false. Inertia feels nice on touchscreen devices
            panInertiaDeceleration: null, // can be null or a value in pixels/second.
        };

        // ------------------------------------------------------------
		// Show the mosaic and highlight every use of an image on
		// right-click/long-press.
		// ------------------------------------------------------------
		
		var MOSAIC_WIDTH = 7200;
		var MOSAIC_HEIGHT = 9225;
		
		/*
		 * This must match the native mosaic zoom calculation used inside
		 * app/leafletzoom.js.
		 */
		var MOSAIC_NATIVE_ZOOM = Math.ceil(
		    Math.log2(Math.max(MOSAIC_WIDTH, MOSAIC_HEIGHT) / 256)
		);
		
		// ShowAndreaMosaic now returns the Leaflet map because of the
		// small change made in app/leafletzoom.js.
		var mosaicMap = ShowAndreaMosaic(
		    'AndreaMosaic',
		    'mosaic/',
		    MOSAIC_WIDTH,
		    MOSAIC_HEIGHT,
		    mapOptions
		);

		// Allow smaller, smoother zoom increments.
		mosaicMap.options.zoomSnap = 0;
		mosaicMap.options.zoomDelta = 0.25;
		
		// Larger number means the mouse wheel zooms more slowly.
		mosaicMap.options.wheelPxPerZoomLevel = 120;
		/*
		 * All red duplicate circles are kept in this layer.
		 * Clearing the layer removes every previous circle at once.
		 */
		var duplicateHighlightLayer = L.layerGroup().addTo(mosaicMap);
		
		/*
		 * Build an index of all tiles grouped by imageNr.
		 *
		 * tileInfo indexes:
		 * 0 = tile x
		 * 1 = tile y
		 * 2 = tile width
		 * 3 = tile height
		 * 4 = tileNr
		 * 5 = imageNr
		 */
		var tilesByImageNr = new Map();
		
		tileArrays.forEach(function (tileInfo) {
		    var imageNr = tileInfo[5];
		
		    if (!tilesByImageNr.has(imageNr)) {
		        tilesByImageNr.set(imageNr, []);
		    }
		
		    tilesByImageNr.get(imageNr).push(tileInfo);
		});
		
		/*
		 * Convert the center of a tile from mosaic pixel coordinates
		 * into a Leaflet LatLng coordinate.
		 */
		var getTileCenterLatLng = function (tileInfo) {
		    var centerX = tileInfo[0] + tileInfo[2] / 2;
		    var centerY = tileInfo[1] + tileInfo[3] / 2;
		
		    return mosaicMap.unproject(
		        [centerX, centerY],
		        MOSAIC_NATIVE_ZOOM
		    );
		};
		
		/*
		 * Draw one red circle over every tile that uses the selected
		 * imageNr.
		 */
		var highlightAllUsesOfImage = function (imageNr) {
		    // Remove circles from the previous selection.
		    duplicateHighlightLayer.clearLayers();
		
		    var matchingTiles = tilesByImageNr.get(imageNr) || [];
		
		    if (matchingTiles.length === 0) {
		        return;
		    }
		
		    var matchingLocations = [];
		
		    matchingTiles.forEach(function (tileInfo) {
		        var tileCenter = getTileCenterLatLng(tileInfo);
		
		        matchingLocations.push(tileCenter);
		
		        L.circleMarker(tileCenter, {
		            radius: 16,
		            color: '#ff0000',
		            weight: 4,
		            opacity: 1,
		            fill: false,
		
		            /*
		             * The circles are visual only. They will not intercept
		             * mouse or touchscreen events.
		             */
		            interactive: false
		        }).addTo(duplicateHighlightLayer);
		    });
		
		    /*
		     * Zoom/pan so every occurrence can be seen.
		     *
		     * Delete this entire block if you want the map to remain at
		     * its current zoom and position.
		     */
		    // if (matchingLocations.length > 1) {
		    //     var duplicateBounds = L.latLngBounds(matchingLocations);
		
		    //     mosaicMap.fitBounds(
		    //         duplicateBounds.pad(0.15),
		    //         {
		    //             animate: true,
		    //             maxZoom: MOSAIC_NATIVE_ZOOM
		    //         }
		    //     );
		    // } else {
		    //     mosaicMap.panTo(matchingLocations[0], {
		    //         animate: true
		    //     });
		    // }
		};
		
		/*
		 * Right-click on desktop or long-press on a touchscreen.
		 *
		 * leafletzoom.js will still run its existing contextmenu handler
		 * and show the normal image-information popup. This additional
		 * handler draws the duplicate circles.
		 */
		mosaicMap.on('contextmenu', function (event) {
		    var mosaicPoint = mosaicMap.project(
		        event.latlng,
		        MOSAIC_NATIVE_ZOOM
		    );
		
		    var clickedTile = getTileObject(
		        Math.floor(mosaicPoint.x),
		        Math.floor(mosaicPoint.y)
		    );
		
		    if (clickedTile === null) {
		        duplicateHighlightLayer.clearLayers();
		        return;
		    }
		
		    highlightAllUsesOfImage(clickedTile.imageNr);
		});
		
		/*
		 * Clear all red circles with a normal left-click/tap.
		 */
		mosaicMap.on('click', function () {
		    duplicateHighlightLayer.clearLayers();
		});
